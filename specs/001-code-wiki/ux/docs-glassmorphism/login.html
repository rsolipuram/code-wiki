<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Wiki - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B5CF6;
            --primary-light: #A78BFA;
            --secondary: #06B6D4;
            --accent: #EC4899;
            --bg-dark: #0A0A0F;
            --bg-darker: #050508;
            --glass-bg: rgba(15, 15, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #F9FAFB;
            --text-secondary: #D1D5DB;
            --text-tertiary: #9CA3AF;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-darker);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Animated Gradient Background */
        .gradient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            bottom: -150px;
            right: -150px;
            animation-delay: -10s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--secondary), var(--primary-light));
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        /* Login wrapper */
        .login-wrapper {
            width: 100%;
            max-width: 480px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Logo area */
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 24px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
            margin-bottom: 16px;
        }

        .logo-name {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            margin-bottom: 6px;
        }

        .logo-tagline {
            font-size: 13px;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
        }

        /* Card body */
        .login-card {
            padding: 40px 36px;
        }

        .login-heading {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-align: center;
        }

        .login-subtext {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 32px;
        }

        /* OAuth buttons */
        .oauth-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 52px;
        }

        .oauth-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 14px 0 0 14px;
        }

        .oauth-btn.github::before { background: #e6edf3; }
        .oauth-btn.gitlab::before { background: #FC6D26; }
        .oauth-btn.bitbucket::before { background: #0052CC; }

        .oauth-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .oauth-btn.github:hover {
            border-color: rgba(230, 237, 243, 0.4);
            box-shadow: 0 6px 24px rgba(230, 237, 243, 0.12);
        }

        .oauth-btn.gitlab:hover {
            border-color: rgba(252, 109, 38, 0.4);
            box-shadow: 0 6px 24px rgba(252, 109, 38, 0.15);
        }

        .oauth-btn.bitbucket:hover {
            border-color: rgba(0, 82, 204, 0.5);
            box-shadow: 0 6px 24px rgba(0, 82, 204, 0.2);
        }

        .oauth-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .oauth-btn-text {
            flex: 1;
            text-align: left;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .divider-text {
            font-size: 13px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        /* Form inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
            min-height: 48px;
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
        }

        /* Sign in button */
        .signin-btn {
            width: 100%;
            padding: 15px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
            margin-top: 8px;
            min-height: 52px;
        }

        .signin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.55);
        }

        .signin-btn:active {
            transform: translateY(0);
        }

        /* Helper links */
        .form-links {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
        }

        .form-link {
            font-size: 13px;
            color: var(--primary-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-link:hover {
            color: var(--secondary);
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }

        .footer-legal {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .footer-legal a {
            color: var(--text-tertiary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-legal a:hover {
            color: var(--primary-light);
        }

        .footer-legal span {
            margin: 0 8px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 520px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .login-card {
                padding: 28px 20px;
            }

            .login-heading {
                font-size: 22px;
            }

            .oauth-btn {
                font-size: 14px;
                padding: 12px 16px;
            }
        }
    /* content-link-style */
        a:not(.nav-item):not(.breadcrumb-link):not(.toc-item):not(.filter-btn):not(.follow-btn):not([class*="btn"]):not([class*="card"]):not([class*="logo"]):not([class*="chip"]):not([class*="badge"]):not(.tab):not(.mobile-logo) {
            color: #06B6D4;
            text-decoration: underline;
            text-decoration-color: rgba(6, 182, 212, 0.4);
            text-underline-offset: 3px;
            transition: color 0.2s, text-decoration-color 0.2s;
        }
        a:not(.nav-item):not(.breadcrumb-link):not(.toc-item):not(.filter-btn):not(.follow-btn):not([class*="btn"]):not([class*="card"]):not([class*="logo"]):not([class*="chip"]):not([class*="badge"]):not(.tab):not(.mobile-logo):hover {
            color: #A78BFA;
            text-decoration-color: rgba(167, 139, 250, 0.6);
        }
</style>
</head>
<body>
    <div class="gradient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="login-wrapper">
        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">CW</div>
            <span class="logo-name">Code Wiki</span>
            <span class="logo-tagline">Documentation that writes itself</span>
        </div>

        <!-- Login card -->
        <div class="glass-card login-card">
            <h1 class="login-heading">Sign in to Code Wiki</h1>
            <p class="login-subtext">Connect your account to start generating documentation</p>

            <!-- OAuth buttons -->
            <div class="oauth-group">
                <!-- GitHub -->
                <a href="#" class="oauth-btn github">
                    <svg class="oauth-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span class="oauth-btn-text">Continue with GitHub</span>
                </a>

                <!-- GitLab -->
                <a href="#" class="oauth-btn gitlab">
                    <svg class="oauth-icon" viewBox="0 0 24 24" fill="#FC6D26">
                        <path d="M22.65 14.39L12 22.13 1.35 14.39a.84.84 0 01-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 014.82 2a.43.43 0 01.58 0 .42.42 0 01.11.18l2.44 7.49h8.1l2.44-7.49a.42.42 0 01.11-.18.43.43 0 01.58 0 .42.42 0 01.11.18l2.44 7.51 1.22 3.78a.84.84 0 01-.3.94z"/>
                    </svg>
                    <span class="oauth-btn-text">Continue with GitLab</span>
                </a>

                <!-- Bitbucket -->
                <a href="#" class="oauth-btn bitbucket">
                    <svg class="oauth-icon" viewBox="0 0 24 24" fill="#0052CC">
                        <path d="M.778 1.213a.768.768 0 00-.768.892l3.263 19.81c.084.5.515.868 1.022.873H19.95a.772.772 0 00.77-.646l3.27-20.03a.768.768 0 00-.768-.891L.778 1.213zM14.52 15.53H9.522L8.17 8.466h7.561l-1.211 7.064z"/>
                    </svg>
                    <span class="oauth-btn-text">Continue with Bitbucket</span>
                </a>
            </div>

            <!-- Divider -->
            <div class="divider">
                <span class="divider-text">or sign in with email</span>
            </div>

            <!-- Email / password form -->
            <form onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="signin-btn">Sign in</button>
            </form>

            <!-- Helper links -->
            <div class="form-links">
                <a href="#" class="form-link">Don't have an account? Sign up</a>
                <a href="#" class="form-link">Forgot password?</a>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <div class="footer-legal">
                    <a href="#">Privacy Policy</a>
                    <span>·</span>
                    <a href="#">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return;
            // Navigate to dashboard on successful sign-in (mockup)
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
